<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f9f6">
    <meta name="description" content="Manage your account and appearance settings.">
    <title>Settings | Traffic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="settings.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Wayfinder home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M16 3.5 26 8v8.1c0 6.3-4.2 10.2-10 12.4-5.8-2.2-10-6.1-10-12.4V8l10-4.5Z" fill="currentColor" opacity=".15"/><path d="m11.2 20.8 3-7.1 7-3-3 7.1-7 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="16.2" cy="15.8" r="1.4" fill="currentColor"/></svg>
        </span>
        <span>Traffic<span class="brand-period">.</span></span>
      </a>
      <nav class="main-nav" aria-label="Main menu">
        <a class="nav-link" href="index.html">Explore</a>
        <a class="nav-link" href="saved.html">Saved places</a>
        <a class="nav-link" id="settings-account-manager-link" href="index.html#account-manager" hidden>Account manager</a>
        <a class="nav-link is-current" href="settings.html" aria-current="page">Settings</a>
      </nav>
      <div class="account-actions">
        <span class="signed-in-label" id="settings-user-label" hidden></span>
        <button class="button button-quiet sign-out-button" id="settings-sign-out" type="button" hidden>Log out</button>
      </div>
    </header>
    <main class="saved-main" id="settings-main" hidden>
      <section class="account-settings" aria-labelledby="account-settings-title">
        <div class="account-settings-heading">
          <h1 id="account-settings-title">Settings</h1>
          <p>Update your login details and appearance.</p>
        </div>
        <form class="settings-form" id="settings-form">
          <label for="settings-username">Username</label>
          <input id="settings-username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" required>
          <label for="settings-current-password">Current password</label>
          <input id="settings-current-password" name="currentPassword" type="password" autocomplete="current-password" required>
          <label for="settings-new-password">New password <span>Leave blank to keep the current password</span></label>
          <input id="settings-new-password" name="newPassword" type="password" minlength="8" autocomplete="new-password">
          <label for="settings-confirm-password">Confirm new password</label>
          <input id="settings-confirm-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password">
          <div class="settings-theme">
            <label for="theme-select">Theme</label>
            <select id="theme-select" name="theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          <div class="account-form-actions">
            <button class="button button-dark button-small" id="settings-save" type="submit">Save account settings</button>
          </div>
          <p class="account-feedback" id="settings-feedback" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
